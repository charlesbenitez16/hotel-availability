spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# ephemeral schema for tests, Flyway is skipped
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

spring.flyway.enabled=false

# Populated automatically by @EmbeddedKafka for tests that load the full
# Spring context. Ignored by slice tests (@WebMvcTest, @DataJpaTest, ...)
# that never touch the Kafka auto-configuration.
spring.kafka.bootstrap-servers=${spring.embedded.kafka.brokers:localhost:9092}

app.kafka.topic.hotel-availability-searches=hotel_availability_searches
app.kafka.topic-partitions=1
app.kafka.topic-replicas=1
