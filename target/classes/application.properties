server.port=8080

spring.application.name=hotel-availability-search

spring.threads.virtual.enabled=true

spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:hotel_availability}
spring.datasource.username=${DB_USERNAME:hotel_app}
spring.datasource.password=${DB_PASSWORD:hotel_app}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.producer.properties.spring.json.add.type.headers=false
spring.kafka.consumer.group-id=hotel-availability-search-consumer
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer

spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
spring.kafka.consumer.properties.spring.deserializer.value.delegate.class=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=com.mindata.hotelavailability.infrastructure.adapter.out.messaging
spring.kafka.consumer.properties.spring.json.value.default.type=com.mindata.hotelavailability.infrastructure.adapter.out.messaging.SearchEventMessage
spring.kafka.consumer.properties.spring.json.use.type.headers=false

app.kafka.topic.hotel-availability-searches=hotel_availability_searches
app.kafka.topic-partitions=3
app.kafka.topic-replicas=1

springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
springdoc.api-docs.path=/v3/api-docs

logging.level.com.mindata.hotelavailability=INFO
# The event trail (logs/hotel-availability.txt) is wired in logback-spring.xml
